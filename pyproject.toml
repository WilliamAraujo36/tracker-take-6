[project]
name = "time-window-rate-tracker"
version = "0.1.0"
description = "Tracks event counts in fixed time windows, exposing per-window totals and sliding-window aggregate counts for rate display."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
